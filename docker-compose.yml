# 可选部署附件（§36.4）：PostgreSQL + AI Hub Server + Runtime 依赖
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong PostgreSQL password}
      POSTGRES_DB: aihub
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
  aihub:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIHUB_MODE: server
      AIHUB_DATA_DIR: /data
      AIHUB_DATABASE_DRIVER: postgres
      AIHUB_DATABASE_URL: ${AIHUB_DATABASE_URL:?Set the PostgreSQL URL with URL-encoded credentials}
      AIHUB_CORS_ALLOWED_ORIGINS: ${AIHUB_CORS_ALLOWED_ORIGINS:-}
      AIHUB_SECRET_BACKEND: env
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
    ports:
      - "8787:8787"
    volumes:
      - aihubdata:/data
volumes:
  pgdata:
  aihubdata:
