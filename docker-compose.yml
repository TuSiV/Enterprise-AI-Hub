# 可选部署附件（§36.4）：PostgreSQL + AI Hub Server + Runtime 依赖
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aihub
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
  aihub:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIHUB_MODE: server
      AIHUB_DATA_DIR: /data
      AIHUB_DATABASE_URL: postgres://postgres:postgres@postgres:5432/aihub
      AIHUB_SECRET_BACKEND: env
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
    ports:
      - "8787:8787"
    volumes:
      - aihubdata:/data
volumes:
  pgdata:
  aihubdata:
