[workspace]
resolver = "2"
members = [
    "crates/api-types",
    "crates/config",
    "crates/telemetry",
    "crates/secrets",
    "crates/domain",
    "crates/provider-core",
    "crates/provider-openai-compatible",
    "crates/provider-openai-responses",
    "crates/provider-anthropic",
    "crates/provider-gemini",
    "crates/persistence",
    "crates/application",
    "crates/gateway",
    "crates/runtime-client",
    "apps/server",
    "apps/mock-openai",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
aihub-api-types = { path = "crates/api-types" }
aihub-config = { path = "crates/config" }
aihub-telemetry = { path = "crates/telemetry" }
aihub-secrets = { path = "crates/secrets" }
aihub-domain = { path = "crates/domain" }
aihub-provider-core = { path = "crates/provider-core" }
aihub-provider-openai-compatible = { path = "crates/provider-openai-compatible" }
aihub-provider-openai-responses = { path = "crates/provider-openai-responses" }
aihub-provider-anthropic = { path = "crates/provider-anthropic" }
aihub-provider-gemini = { path = "crates/provider-gemini" }
aihub-persistence = { path = "crates/persistence" }
aihub-application = { path = "crates/application" }
aihub-gateway = { path = "crates/gateway" }
aihub-runtime-client = { path = "crates/runtime-client" }
aihub-server = { path = "apps/server" }

tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
hyper = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tar = "0.4"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
async-stream = "0.3"
futures = "0.3"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
dirs = "5"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }
clap = { version = "4", features = ["derive"] }
http = "1"

[profile.release]
lto = "thin"
strip = "symbols"
