name: CI

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "apps/**"
      - "web/**"
      - "runtime/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "crates/**"
      - "apps/**"
      - "web/**"
      - "runtime/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  # Rust Core + Server + Mock（不含 desktop：Tauri 在 Linux 需要 GUI 栈，由 desktop job 单独验证）
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aihub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # keyring 的 Linux 后端（sync-secret-service）编译需要 dbus 系统库
      - name: Install system deps (keyring/Linux)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --exclude aihub-desktop -- -D warnings
      - name: Test (SQLite contract + gateway/platform e2e)
        run: cargo test --workspace --exclude aihub-desktop
      - name: Test (PostgreSQL contract)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/aihub_test
        run: cargo test -p aihub-persistence --test pg_contract -- --ignored

  # Desktop 壳（Tauri 2）：Linux 下编译需要 WebKit/GTK 系统栈，单独 job 验证编译
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev pkg-config libdbus-1-dev
      - name: Clippy (desktop shell)
        run: cargo clippy -p aihub-desktop -- -D warnings

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck + Build
        run: npm run build
